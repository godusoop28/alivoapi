server:
  port: ${PORT:8080}

spring:
  application:
    name: alivos-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:3000}
  vimeo:
    access-token: ${VIMEO_ACCESS_TOKEN:}
  mercadopago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
  seed:
    enabled: ${SEED_ON_STARTUP:true}

logging:
  level:
    com.alivos.api: INFO

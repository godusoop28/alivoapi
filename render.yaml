databases:
  - name: alivos-db
    plan: free
    databaseName: alivos
    user: alivos

services:
  - type: web
    name: alivos-api
    runtime: docker
    rootDir: alivosApi
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alivos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "604800000"
      - key: CORS_ORIGIN
        value: https://alivoweb-uuoo.vercel.app
      - key: VIMEO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
